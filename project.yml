name: NPSiOS
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: "NO"
    INFOPLIST_FILE: NPSiOS/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.example.npsiOS
    PRODUCT_NAME: NPSiOS
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    MARKETING_VERSION: "1.0.3"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_BITCODE: "NO"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    SWIFT_EMIT_LOC_STRINGS: "YES"
  configs:
    Debug: {}
    Release: {}
targets:
  NPSiOS:
    type: application
    platform: iOS
    deploymentTarget:
      iOS: "16.0"
    sources:
      - path: NPSiOS
        excludes:
          - "*.md"
          - "*.xcodeproj"
          - "Info.plist"
